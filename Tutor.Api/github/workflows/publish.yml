name: Publish
run-name: Publish Tutor

on:
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: 10.0.x
  PROJECT_PATH: Tutor.Api/Tutor.Api.csproj
  PUBLISH_DIR: publish

jobs:
  publish:
    name: Test and Publish
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Determine version
        id: version
        run: |
          set -euo pipefail

          commit_message="$(git log -1 --pretty=%B)"
          base_version="$(
            printf '%s\n' "$commit_message" |
            grep -Eo '(^|[^0-9])([0-9]+\.[0-9]+\.[0-9]+)([^0-9]|$)' |
            grep -Eo '[0-9]+\.[0-9]+\.[0-9]+' |
            head -n 1 || true
          )"

          if [ -z "$base_version" ]; then
            base_version="$(git tag --list | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -Vr | head -n 1 || true)"
          fi

          if [ -z "$base_version" ]; then
            echo "No version found. Add a version like 1.2.3 to the commit message or create a git tag like 1.2.3." >&2
            exit 1
          fi

          app_version="$base_version.${GITHUB_RUN_NUMBER}"
          app_name="Tutor $app_version"
          artifact_name="$app_name.tar.gz"

          echo "app_version=$app_version" >> "$GITHUB_OUTPUT"
          echo "app_name=$app_name" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore Tutor.Api.sln

      - name: Test
        run: dotnet test Tutor.Api.sln --configuration Release --no-restore

      - name: Publish app
        run: >
          dotnet publish "$PROJECT_PATH"
          --configuration Release
          --no-restore
          --output "$PUBLISH_DIR"
          -p:Version="${{ steps.version.outputs.app_version }}"
          -p:AssemblyVersion="${{ steps.version.outputs.app_version }}"
          -p:FileVersion="${{ steps.version.outputs.app_version }}"
          -p:InformationalVersion="${{ steps.version.outputs.app_version }}+${GITHUB_SHA}"

      - name: Package published app
        run: tar -czf "${{ steps.version.outputs.artifact_name }}" -C "$PUBLISH_DIR" .

      - name: Upload published artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.app_name }}
          path: ${{ steps.version.outputs.artifact_name }}
          if-no-files-found: error
          retention-days: 7
