name: Publish
run-name: Tutor 1.0.0.${{ github.run_number }}

on:
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: 10.0.x
  PROJECT_PATH: Tutor.Api/Tutor.Api.csproj
  PUBLISH_DIR: publish
  APP_VERSION: 1.0.0.${{ github.run_number }}
  APP_NAME: Tutor 1.0.0.${{ github.run_number }}
  ARTIFACT_NAME: Tutor 1.0.0.${{ github.run_number }}.tar.gz

jobs:
  publish:
    name: Test and Publish
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Test
        run: dotnet test Tutor.Api.sln --configuration Release --no-restore

      - name: Publish app
        run: >
          dotnet publish "$PROJECT_PATH"
          --configuration Release
          --no-restore
          --output "$PUBLISH_DIR"
          -p:Version="$APP_VERSION"
          -p:AssemblyVersion="$APP_VERSION"
          -p:FileVersion="$APP_VERSION"
          -p:InformationalVersion="$APP_VERSION+${GITHUB_SHA}"

      - name: Package published app
        run: tar -czf "$ARTIFACT_NAME" -C "$PUBLISH_DIR" .

      - name: Upload published artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}
          path: ${{ env.ARTIFACT_NAME }}
          if-no-files-found: error
          retention-days: 7
